[build]
  command = "yarn install && yarn build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  YARN_VERSION = "1.22.18"

# docs.igralabs.com is a Netlify domain alias of this site → send it to the GitBook
# docs. Must stay ABOVE the SPA catch-all below: Netlify applies the first match.
[[redirects]]
  from = "https://docs.igralabs.com/*"
  to = "https://igra-labs.gitbook.io/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200